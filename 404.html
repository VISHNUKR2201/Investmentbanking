<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | KRSTACKLY Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #700a0a;         /* Deep dark red background */
            --bg-secondary: #4a0505;       /* Darker card background */
            --accent: #c9973e;             /* Gold primary interactive accent */
            --accent-hover: #e5b35c;       /* Bright gold for hover states */
            --text-primary: #ffffff;       /* Pure white text */
            --text-secondary: #dac8c8;     /* Soft crimson-grey for subtext */
            --border-color: rgba(255, 255, 255, 0.1);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Outfit', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050000; /* Extra dark base for contrast */
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Premium Background Gradient Blobs */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(112, 10, 10, 0.45) 0%, rgba(74, 5, 5, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
            filter: blur(80px);
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                width: 500px;
                height: 500px;
                opacity: 0.8;
            }
            100% {
                width: 700px;
                height: 700px;
                opacity: 1.2;
            }
        }

        .error-container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 90%;
            padding: 4.5rem 3.5rem;
            background: rgba(74, 5, 5, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(199, 151, 62, 0.05);
            animation: containerAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes containerAppear {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: clamp(6rem, 12vw, 9rem);
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -0.02em;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--accent) 30%, #ffd07d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(199, 151, 62, 0.15);
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 3.5rem;
        }

        .error-actions {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }

        @media (max-width: 500px) {
            .error-actions {
                flex-direction: column;
            }
            .error-container {
                padding: 3rem 2rem;
            }
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 1.1rem 2.2rem;
            border-radius: 4px;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: var(--transition-smooth);
            cursor: pointer;
            text-decoration: none;
            border: none;
            outline: none;
            flex: 1;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #050000;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 20px rgba(199, 151, 62, 0.2);
        }

        .btn-primary:hover {
            background-color: transparent;
            color: var(--accent);
            box-shadow: 0 8px 20px rgba(199, 151, 62, 0);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(199, 151, 62, 0.05);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">LOST IN TRANSIT</h1>
        <p class="error-desc">The silhouette or page you are looking for does not exist in our archive. It may have been relocated or retired.</p>
        
        <div class="error-actions">
            <a href="#" class="btn btn-outline" id="goBackBtn">Go Back</a>
            <a href="index.html" class="btn btn-primary">Back to Home</a>
        </div>
    </div>

    <script>
        // Setup Go Back action using history.back() with home fallback
        document.getElementById('goBackBtn').addEventListener('click', function(e) {
            e.preventDefault();
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
